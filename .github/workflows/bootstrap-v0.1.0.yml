name: Publish validated Daylight 0.1.0
on: workflow_dispatch
permissions:
  contents: write
concurrency:
  group: bootstrap-v0.1.0
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download validated CI archives
        env:
          X64_URL: ${{ secrets.BOOTSTRAP_X64_URL }}
          ARM64_URL: ${{ secrets.BOOTSTRAP_ARM64_URL }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output x64.zip "$X64_URL" &
          first=$!
          curl --fail --location --retry 3 --output arm64.zip "$ARM64_URL" &
          second=$!
          wait "$first"
          wait "$second"
          echo '064ea1fe4b1f5ae4ca37e74f5f61699b1f269194490285d60113f42c85daaa78  x64.zip' | sha256sum --check
          echo '8596bd1f08af06e1550f728736aca33f5b1dc4e04705b4a2baebc72ae3002c4d  arm64.zip' | sha256sum --check
      - name: Prepare and validate release files
        run: |
          set -euo pipefail
          mkdir -p unpacked/x64 unpacked/arm64 stage
          unzip -q x64.zip -d unpacked/x64
          unzip -q arm64.zip -d unpacked/arm64
          find unpacked -type f -exec cp {} stage/ \;
          python3 - <<'PY'
          import pathlib, json, hashlib
          root=pathlib.Path('stage')
          assert len(list(root.iterdir())) == 10
          for arch in ('x64','arm64'):
              feed=json.loads((root/f'releases.stable-{arch}.json').read_text())
              assert len(feed['Assets']) == 1
              asset=feed['Assets'][0]
              assert asset['PackageId']=='Daylight.App' and asset['Version']=='0.1.0' and asset['Type']=='Full'
              assert asset['FileName']==f'Daylight.App-0.1.0-stable-{arch}-full.nupkg'
              package=root/asset['FileName']
              assert package.stat().st_size==asset['Size']
              with package.open('rb') as f:
                  assert hashlib.file_digest(f,'sha256').hexdigest().upper()==asset['SHA256'].upper()
              assert (root/f'Daylight.App-stable-{arch}-Setup.exe').stat().st_size>0
          PY
          (cd stage && sha256sum * > ../SHA256SUMS)
          mv SHA256SUMS stage/
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: mokkshchoudhary/screen-time-win-releases
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          Daylight's first runnable Windows release, with an AMOLED interface based on the Figma design.
          
          - Foreground application tracking with idle, lock, and sleep handling.
          - Optional Chrome website tracking through the included companion extension.
          - Daily and weekly activity views, application and website breakdowns, reminder limits, exclusions, and CSV/JSON exports.
          - Activity history stored locally on your PC. Recording starts off and requires your consent.
          - Installed builds check for updates, download them in the background, and offer **Restart to update** in Settings.
          
          ## Install
          
          Download **Daylight.App-stable-x64-Setup.exe** for most Intel/AMD Windows PCs, or **Daylight.App-stable-arm64-Setup.exe** for Windows on ARM. The installer includes the .NET runtime. The other files are update packages and metadata.
          
          Chrome tracking needs the companion extension. In Daylight Settings, choose **Set up Chrome** and follow the included guide to load the extension folder. Enable website tracking both in Daylight and in the extension popup for each Chrome profile. The Chrome Web Store listing is not published yet.
          
          ## Early release status
          
          This build is unsigned. Windows may show an unknown-publisher or SmartScreen prompt. Publisher signing is still pending. Limits provide reminders and do not block applications or websites.
          
          Both x64 and ARM64 packages were built in GitHub Actions. The x64 installer passed an actual isolated install-and-uninstall smoke test; ARM64 has been cross-built and has not been tested on ARM hardware. CI also passed 30 .NET tests, the Chrome bridge tests, and agent and native UI smoke checks.
          
          Source commit: `be6f70ecc62d1325c4fc492832716e62677a50cd` in the private source repository. Build run: https://github.com/mokkshchoudhary/screen-time-win/actions/runs/39184083343 (requires source access).
          
          Use `SHA256SUMS` to verify the downloaded files. Application history is stored separately from installed binaries and is preserved by uninstall.
          NOTES
          gh release create v0.1.0 stage/* --draft --title 'Daylight 0.1.0 — first Windows release' --notes-file notes.md
          gh release edit v0.1.0 --draft=false
